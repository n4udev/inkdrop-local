[project]
name = "inkdrop-local"
version = "1.0.0"
description = "A private, local browser interface powered by Microsoft MarkItDown"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "markitdown[pdf,docx,pptx,xlsx]>=0.1.6,<0.2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
